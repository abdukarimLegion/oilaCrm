spring:
  application:
    name: oilacrm-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oilacrm}
    username: ${DB_USER:oilacrm}
    password: ${DB_PASSWORD:oilacrm}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Skema Flyway database bilan boshqariladi — faqat tekshiriladi
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true

gemini:
  # AI martabali (SmartReceiptScannerModal, BudgetPlanner AI forecast) uchun kalid.
  # Set bo'lmasa — demo fallback rejimida ishlaydi.
  api-key: ${GEMINI_API_KEY:}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
